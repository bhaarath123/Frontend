<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>Forgot Password</title>
</head>
<body>
    <header>
        <section>
            <div>
    <h2>Reset Password</h2>
    <p>Enter your email address below, and we will send you a link to reset your password.</p>
            </div>

    <form action=password-reset-endpoint method="POST">
        
        <div>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter the email " name="email" required>

            </p>
        </div>

        <div>
            <p>
                <button type="submit">Send Reset Link</button>
            </p>
        </div>

    </form>

    <p>
        Remember your password? <a href="../pages/Login.html">Back to Login</a>
    </p>
    </section>
    </header>
</body>
</html>
