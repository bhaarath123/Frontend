<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>contact form</title>
    </head>
    <body>
        <center>
        <header>
            <main>
            <section>
                <h2>Contact form</h2>
                <form action="contact Data collection" method="post">
                    <div>
                        <label for="First name">First name:</label>
                        <input type="text" id="Firstname" name="Firstname" placeholder="First name" required> 
                    </div>
                    
                    <br>
                    
                    <div>
                        <label for="Last name">Last name:</label>
                        <input type="text" id="lasttname" name="lastname" placeholder="Last name" required> 
                    </div>

                    <br>

                     <div>
                        <label for="Email">Email:</label>
                        <input type="email" id="Email" name="Email" placeholder="Entre the email" required> 
                    </div>

                    <br>

                     <div>
                        <label for="Message">message</label>
                        <textarea id="Message" name="Message" rows="5" cols="30" placeholder="Write a message here..required"></textarea> 
                    </div>

                </form>
            </section>

            </main>
        </header>
        </center>
    </body>
</html>
