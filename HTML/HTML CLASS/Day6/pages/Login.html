<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
</head>
<body>
    <center>
    <main>
        <section>
            <div>
            <h1>Login</h1>
            <form action="#" method="post">
                <label for="name">Username</label>
                <input type="text" id="Username" placeholder="Enter the name" name="name"required>
            </div>
            
            <br>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter the password" name="password" required>
            </div>
            
            
            <br>
            
            <div>
                <label for="remember">remember me</label>
                <input type="checkbox" id="remember" name="remember">
            </div>
            
            <br>

                <button type="submit">Log In</button>
            <div>

                 <p>
                    New user? <a href="../pages/Register.html">Create a Account</a>
                </p>

                <p>
                    <a href="../pages/Forget.html">Forget password?</a>
                </p>
               
            </div>
            </form>
        </section>
    </main>
    </center>
</body>
</html>
