<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application form</title>
</head>
<body>
    <center>
    <header>
        <main>
            <section>
                <h1>Job Application Form</h1>
                <p>
                    Please fill out the form below to apply for the position.
                </p>
                <form action="../pages/Register.html" method="post" enctype="multipart/form-data">
                    <fieldset>
                        <legend><strong>Personal Information</strong></legend>
                        <div>
                        <label for="First name">First name:</label>
                        <input type="text" id="Firstname" name="Firstname" placeholder="First name" required> 
                    </div>
                    
                    <br>
                    
                    <div>
                        <label for="Last name">Last name:</label>
                        <input type="text" id="lasttname" name="lastname" placeholder="Last name" required> 
                    </div>

                    <br>

                     <div>
                        <label for="Email">Email:</label>
                        <input type="email" id="Email" name="Email" placeholder="Entre the email" required> 
                    </div>

                    <br>

                    <div>
                        <label for="tel">Mobile no:</label>
                <input type="number" id="Mobile no" placeholder="Enter a 10 digit number" name="tel" required>
                
                    </div>
                
                </fieldset>
                
        <fieldset>
            <legend><strong>Position Details</strong></legend>
            <p>
                <label for="position">What position are you applying for?</label><br>
                <select id="position" name="position" required>
                    <option value="">-- Select a Position --</option>
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="java">Java Full stack Developer</option>
                    <option value="Ai">Software Engineer</option>
                </select>
            </p>
            <p>
                <label for="start-date">Available Start Date:</label><br>
                <input type="date" id="start-date" name="start_date" required>
            </p>
            <p>
                <label>Employment Type Desired:</label><br>
                <input type="radio" id="full-time" name="employment_type" value="full-time" checked>
                <label for="full-time">Full-Time</label><br>
                <input type="radio" id="part-time" name="employment_type" value="part-time">
                <label for="part-time">Part-Time</label><br>
                <input type="radio" id="contract" name="employment_type" value="contract">
                <label for="contract">Contract</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend><strong>Application Documents & Details</strong></legend>
            <p>
                <label for="resume">Upload Resume (PDF or Doc):</label><br>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </p>

            <p>
                <label for="cover-letter">Why should we hire you?</label><br>
                <textarea id="cover-letter" name="cover_letter" rows="6" cols="50" placeholder="Type your cover letter here..."></textarea>
            </p>
        </fieldset>

        <br>

        <p>
            <input type="checkbox" id="terms" name="terms" value="agreed" required>
            <label for="terms">I certify that all information provided is true and accurate.</label>
        </p>

        <p>
            <input type="submit" value="Submit Application">
            <input type="reset" value="Reset Form">
        </p>

                </form>
                <div>

                </div>
            </section>
        </main>
    </header>
    </center>
</body>
</html>
