<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formatting</title>
    </head>
    <body>
        <h1>Formatting Example</h1>
        <p><strong>First paragraph.</strong></p>
        <p><em>Second paragraph.</em></p>
        <p><u>Third paragraph.</u></p>
        <p><del>Fourth paragraph.</del></p>
        <p><mark>Fifth paragraph.</mark></p>
        <p><small>Sixth paragraph.</small></p>
    </body>
</html>
