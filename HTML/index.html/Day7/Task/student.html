<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>

    <header>
        <p>Student Registration</p>
    </header>

    <br>

    <section>

        <h2>Create Your Account</h2>

        <form action="register process" method="post" enctype="multipart/form-data">

            <p>
                <label>Full Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your full name">
            </p>

            <p>
                <label>Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </p>

            <p>
                <label>Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            </p>
            <p>
                <label>Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Enter a password">
            </p>
            <p>
                <label>Age:</label><br>
                <input type="number" id="Age" name="Age" min="18" max="60">
            </p>
            <p>
                <label>Gender:</label><br>

                <input type="radio" id="Male" name="gender" value="Male">
                <input type="radio" id="female" name="gender" value="female">
                <input type="radio" id="other" name="gender" value="other">
            </p>


            <p>
                <div>
                    <label>Skills:</label>
            <input type="checkbox" id="html" name="skills" value="html"> HTML
            <input type="checkbox" id="css" name="skills" value="css"> CSS
            <input type="checkbox" id="javascript" name="skills" value="javascript"> JAVASCRIPT
        </div>
        <div><label>Course:</label>
            <select name="course"><option>Web Dev</option></select>
        </div>
        <div><label>Address:</label><textarea name="address"></textarea></div>
        <div><label>Photo:</label><input type="file" name="photo"></div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <h2>Student List</h2>
    <table>
        <tr><th>ID</th><th>Name</th><th>Course</th><th>Email</th><th>Mobile</th><th>Status</th></tr>
        <tr><td>001</td><td>Jane Doe</td><td>Web</td><td>jane@ex.com</td><td>555-0100</td><td>Active</td></tr>
    </table>
</body>
</html>
