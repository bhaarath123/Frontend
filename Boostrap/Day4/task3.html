<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3: Four Columns (Tailwind)</title>
    <!-- Loading Tailwind CSS via CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Container wrapper centered horizontally -->
    <div class="container mx-auto mt-10 px-4">
        
        <!-- Single grid row wrapper split into 4 equal slices -->
        <div class="grid grid-cols-4 text-center">
            
            <!-- Box 1 -->
            <div class="p-4 bg-emerald-600 text-white">
                <h4 class="text-lg font-semibold">Box 1</h4>
                <p class="text-sm">Content One</p>
            </div>

            <!-- Box 2 -->
            <div class="p-4 bg-red-600 text-white">
                <h4 class="text-lg font-semibold">Box 2</h4>
                <p class="text-sm">Content Two</p>
            </div>

            <!-- Box 3 -->
            <div class="p-4 bg-cyan-500 text-slate-900">
                <h4 class="text-lg font-semibold">Box 3</h4>
                <p class="text-sm">Content Three</p>
            </div>

            <!-- Box 4 -->
            <div class="p-4 bg-slate-800 text-white">
                <h4 class="text-lg font-semibold">Box 4</h4>
                <p class="text-sm">Content Four</p>
            </div>

        </div>
    </div>

</body>
</html>
