<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2: Two Columns (Tailwind)</title>
    <!-- Loading Tailwind CSS via CDN -->
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <!-- Container wrapper centered horizontally -->
    <div class="container mx-auto mt-10 px-4">
        
        <!-- Row substitute using Tailwind Grid layout system -->
        <div class="grid grid-cols-2">
            
            <!-- Left Column (Takes up 1 of the 2 grid sections) -->
            <div class="p-4 bg-blue-600 text-white">
                <h3 class="text-xl font-bold mb-2">LEFT SECTION</h3>
                <p>This is the left side block containing content.</p>
            </div>

            <!-- Right Column (Takes up 1 of the 2 grid sections) -->
            <div class="p-4 bg-amber-500 text-slate-900">
                <h3 class="text-xl font-bold mb-2">RIGHT SECTION</h3>
                <p>This is the right side block containing content.</p>
            </div>

        </div>
    </div>

</body>
</html>
