<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
        }
        h2 { margin-top: 0; text-align: center; color: #111827; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #4b5563; }
        .form-group input { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; background-color: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s ease; }
        button:hover { background-color: #047857; }
        p { text-align: center; font-size: 14px; margin-top: 15px; color: #6b7280; }
        a { color: #059669; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>User Login</h2>
        <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter password">
        </div>
        <button id="login-btn">Sign In</button>
        <p>New user? <a href="task1.html">Register here</a></p>
    </div>

    <!-- Isolated Login Script -->
    <script src="assets/js/task2.js"></script>
</body>
</html>
