<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Shopping Product Card</title>
    <link rel="stylesheet" href="assets/product.css" />
  </head>
  <body>
    <div class="product-card">
      <img src="assets/2.png" alt="Product image" />
      <h1>iPhone Models</h1>
      <p class="price"><strong>₹70,000</strong></p>
      <p class="description">
        Explore the latest iPhone models with premium performance and advanced camera features.
      </p>
      <a
        href="https://www.apple.com/in/iphone/"
        target="_blank"
        rel="iphone"
        class="buy-link">
    Buy now
      </a>
    </div>
  </body>
</html>
