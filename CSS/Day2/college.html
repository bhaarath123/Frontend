<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Cards</title>
    <link rel="stylesheet" href="assets/college.css">
</head>
<body>
    <h1>Departments</h1>

    <div class="dept-card" id="cse">
        <h2>CSE</h2>
        <p>Computer Science and Engineering</p>
    </div>

    <div class="dept-card" id="it">
        <h2>IT</h2>
        <p>Information Technology</p>
    </div>

    <div class="dept-card" id="ece">
        <h2>ECE</h2>
        <p>Electronics and Communication Engineering</p>
    </div>

    <div class="dept-card" id="eee">
        <h2>EEE</h2>
        <p>Electrical and Electronics Engineering</p>
    </div>

    <div class="dept-card" id="mechanical">
        <h2>Mechanical</h2>
        <p>Mechanical Engineering</p>
    </div>
</body>
</html>
