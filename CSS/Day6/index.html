<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="assets/student.css">
</head>
<body>
    <header id="main-header">
        <div class="logo">EducationPortal</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Classes</a>
            <a href="#">Grades</a>
        </nav>
    </header>

    <main class="dashboard-container">
        <section id="welcome-profile">
            <h1>Welcome back, Bhaarath!</h1>
            <p>Course: Full stack developer</p>
        </section>

        <section class="card-grid">
            <article class="stat-card">
                <h3>GPA</h3>
                <p class="stat-value">7.0</p>
            </article>

            <article class="stat-card">
                <h3>Attendance</h3>
                <p class="stat-value">94%</p>
            </article>

            <article class="stat-card">
                <h3>Assignments</h3>
                <p class="stat-value">No Pending</p>
            </article>
        </section>
    </main>

</body>
</html>
