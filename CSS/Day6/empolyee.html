<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Cards</title>
    <link rel="stylesheet" href="assets/empolyee.css">
</head>
<body>

    <div class="card-container">
        
        <div class="employee-card">
            <img class="employee-photo" src="assets/7.png" alt="Sarah Jenkins">
            <h3 class="employee-name">vijay</h3>
            <p class="employee-dept">Engineering</p>
            <a href="mailto:vijay@gmail.com" class="employee-email">vijay@gmail.com</a>
        </div>


        <div class="employee-card">
            <img class="employee-photo" src="assets/8.png" alt="Marcus Chen">
            <h3 class="employee-name">Ajith</h3>
            <p class="employee-dept">Design</p>
            <a href="mailto:ajith@gmail.com" class="employee-email">ajith@gmail.com</a>
        </div>

        <div class="employee-card">
            <img class="employee-photo" src="assets/9.png" alt="Elena Rostova">
            <h3 class="employee-name">pradeep</h3>
            <p class="employee-dept">Marketing</p>
            <a href="mailto:pradeep@gmail.com" class="employee-email">pradeep@gmail.com</a>
        </div>

    </div>

</body>
</html>
