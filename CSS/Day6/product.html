<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards Row</title>
    <link rel="stylesheet" href="assets/product.css">
</head>
<body>

    <div class="card-container">
        <div class="product-card">
            <img src="assets/1.png" alt="Iphone" width="150" height="150">
            <h3>Iphone models</h3>
            <p>90,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="assets/2.png" alt="Watch" width="150" height="150">
            <h3>Smart Watch</h3>
            <p>3000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="assets/3.png" alt="Shoes" width="150" height="150">
            <h3>Running Shoes</h3>
            <p>1700</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
           <img src="assets/4.png" alt="Wallet" width="150" height="150">
            <h3>Leather Wallet</h3>
            <p>2300</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
        <img src="assets/5.png" alt="T-shirt" width="150" height="150">
            <h3>T-shirt</h3>
            <p>600</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
           <img src="assets/6.png" alt="laptop" width="150" height="150">
            <h3>Mac laptop</h3>
            <p>1,30,000</p>
            <button>Add to Cart</button>
        </div>
    </div>

</body>
</html>
