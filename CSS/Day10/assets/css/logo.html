<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Logo Rotation</title>
  <link rel="stylesheet" href="../css/logo.css">
</head>
<body>

  <div class="logo-container">
    <!-- Google Logo -->
    <div class="logo google">
      <img src="../images/google.png" alt="Google Logo">
      <span>Google</span>
    </div>

    <!-- Microsoft Logo -->
    <div class="logo microsoft">
      <img src="../images/microsoft.png" alt="Microsoft Logo">
      <span>Microsoft</span>
    </div>

    <!-- Apple Logo -->
    <div class="logo apple">
      <img src="../images/Apple-Logo.png" alt="Apple Logo">
      <span>Apple</span>
    </div>

    <!-- Amazon Logo -->
    <div class="logo amazon">
      <img src="../images/amazon.png" alt="Amazon Logo">
      <span>Amazon</span>
    </div>

    <!-- Tesla Logo -->
    <div class="logo tesla">
      <img src="../images/Tesla_logo.png" alt="Tesla Logo">
      <span>Tesla</span>
    </div>
  </div>

</body>
</html>
