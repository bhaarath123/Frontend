<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card Lift Effect</title>
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>

  <div class="product-grid">
    
    <div class="product-card">
      <img src="../images/1.png" alt="Wireless Headphones">
      <h3>iphone</h3>
      <p class="price">$99.99</p>
      <button class="buy-btn">Buy Now</button>
    </div>


    <div class="product-card">
      <img src="../images/2.png" alt="Smart Watch">
      <h3>Smart Watch</h3>
      <p class="price">$149.99</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <div class="product-card">
      <img src="../images/3.png" alt="Gaming Mouse">
      <h3>sports shoe</h3>
      <p class="price">$49.99</p>
      <button class="buy-btn">Buy Now</button>
    </div>


    <div class="product-card">
        <img src="../images/4.png" alt="wallet">
        <h3>leather wallet</h3>
        <p class="price">$50.04</p>
        <button class="buy-btn">Buy Now</button>
    </div>

  </div>

</body>
</html>
