<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>
    <style>
        body {
            text-align: center;
        }

        .box {
            width: 300px;
            height: 150px;
            text-align: center;
            margin: 20px auto;
        }

        .box-one {
            background-color: rgb(230, 230, 123);
            color: rgb(122, 106, 106);
        }

        .box-two {
            background-color: rgb(122, 122, 32);
            color: rgb(163, 62, 62);
        }

        .box-three {
            background-color: rgb(40, 99, 126);
            color: rgb(116, 93, 177);
        }

        .box-four {
            background-color: rgb(255, 182, 193);
            color: rgb(139, 0, 139);
        }

        .box-five {
            background-color: rgb(173, 216, 230);
            color: rgb(0, 100, 0);
        }
    </style>
</head>
<body>
    <div class="box box-one">
        <h2>Box One Heading</h2>
        <p>This is the first colored box.</p>
    </div>

    <div class="box box-two">
        <h2>Box Two Heading</h2>
        <p>This is the second colored box.</p>
    </div>

    <div class="box box-three">
        <h2>Box Three Heading</h2>
        <p>This is the third colored box.</p>
    </div>

    <div class="box box-four">
        <h2>Box Four Heading</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <div class="box box-five">
        <h2>Box Five Heading</h2>
        <p>This is the fifth colored box.</p>
    </div>
</body>
</html>
