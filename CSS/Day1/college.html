<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>College Department</title>
    <style>
        h1 {
            text-align: center;
            color: rgb(165, 114, 48);
        }
       .dept-box {
            background-color: rgb(113, 167, 167);
            width: 400px;
            height: 200px;
            text-align: center;
            padding: 25px;
            border: 2px solid #201414;
            margin: 20px;
        }

        .CSE{
            background-color: rgb(177, 135, 84);
        }

        .IT{
            background-color: rgb(197, 197, 219);
        }

        .EEE{
            background-color: rgb(252, 209, 227);
        }

        .ECE{
            background-color: rgb(96, 100, 102);
        }

        .MECHANICAL{
            background-color: rgb(124, 78, 52);
        }
    </style>
    </head>
    <body>
        <main>
            <h1>Engineering Department</h1>
            <section>
                <div class=".dept-box CSE">
                    <h2>CSE</h2>
                    <P>Computer science & Engineering</P>
                </div>

                 <div class=".dept-box IT">
                    <h2>IT</h2>
                    <P>Information Technology</P>
                </div>

                 <div class=".dept-box EEE">
                    <h2>EEE</h2>
                    <P>Electrical & Electronics</P>
                </div>

                 <div class=".dept-box ECE">
                    <h2>ECE</h2>
                    <P>Electronics & Communication</P>
                </div>

                 <div class=".dept-box MECHANICAL">
                    <h2>MECHANICAL</h2>
                    <P>Mechanical Engineering</P>
                </div>
            </section>
        </main>
    </body>
</html>
