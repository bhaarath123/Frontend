<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Favorites</title>
		<style>
			.place {
				background-color: #ffefd5;
				color: #333;
				width: 320px;
				height: 100px;
				text-align: center;
				margin: 12px auto;
				padding-top: 28px;
				box-sizing: border-box;
			}
			.actor {
				background-color: #e6e6fa;
				color: #222;
				width: 320px;
				height: 100px;
				text-align: center;
				margin: 12px auto;
				padding-top: 28px;
				box-sizing: border-box;
			}
			.sport {
				background-color: #f0fff0;
				color: #0b3d91;
				width: 320px;
				height: 100px;
				text-align: center;
				margin: 12px auto;
				padding-top: 28px;
				box-sizing: border-box;
			}
			body { font-family: Arial, sans-serif; }
		</style>
	</head>
	<body>
		<main>
			<section style="background-color:#ffe4e1; color:#5b0000; width:320px; height:100px; text-align:center; margin:12px auto; padding-top:28px; box-sizing:border-box;">
				<strong>Favorite Food:</strong> Pizza
			</section>

			<section style="background-color:#fffacd; color:#665400; width:320px; height:100px; text-align:center; margin:12px auto; padding-top:28px; box-sizing:border-box;">
				<strong>Favorite Movie:</strong> Inception
			</section>
			
			<section class="place">
				<strong>Favorite Place:</strong> Paris
			</section>

			<section class="actor">
				<strong>Favorite Actor:</strong> Leonardo DiCaprio
			</section>

			<section class="sport">
				<strong>Favorite Sport:</strong> Football
			</section>
		</main>
	</body>
</html>
