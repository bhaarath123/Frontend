<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Cards</title>
  <!-- Linking the external CSS file -->
  <link rel="stylesheet" href="../css/product.css">
</head>
<body>

  <main class="product-grid">
    <!-- Card 1 -->
    <div class="product-card">
      <img class="product-image" src="../images/7.png" alt="Premium Wireless Headphones">
      <h2 class="product-name">Premium Wireless Headphones</h2>
      <p class="product-price">₹14,999</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 2 -->
    <div class="product-card">
      <img class="product-image" src="../images/8.png" alt="Smart Fitness Watch">
      <h2 class="product-name">Smart Fitness Watch</h2>
      <p class="product-price">₹7,499</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 3 -->
    <div class="product-card">
      <img class="product-image" src="../images/9.png" alt="Mechanical Keyboard">
      <h2 class="product-name">Mechanical Keyboard</h2>
      <p class="product-price">₹4,200</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 4 -->
    <div class="product-card">
      <img class="product-image" src="../images/10.png" alt="Ergonomic Gaming Mouse">
      <h2 class="product-name">Ergonomic Gaming Mouse</h2>
      <p class="product-price">₹2,999</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 5 -->
    <div class="product-card">
      <img class="product-image" src="../images/11.png" alt="4K Ultra HD Monitor">
      <h2 class="product-name">4K Ultra HD Monitor</h2>
      <p class="product-price">₹24,999</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 6 -->
    <div class="product-card">
      <img class="product-image" src="../images/12.png" alt="Portable Bluetooth Speaker">
      <h2 class="product-name">Portable Bluetooth Speaker</h2>
      <p class="product-price">₹3,499</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 7 -->
    <div class="product-card">
      <img class="product-image" src="../images/13.png" alt="HD Web Camera with Mic">
      <h2 class="product-name">HD Web Camera with Mic</h2>
      <p class="product-price">₹1,899</p>
      <button class="buy-btn">Buy Now</button>
    </div>

    <!-- Card 8 -->
    <div class="product-card">
      <img class="product-image" src="../images/14.png" alt="Dual-Band Wi-Fi Router">
      <h2 class="product-name">Dual-Band Wi-Fi Router</h2>
      <p class="product-price">₹2,499</p>
      <button class="buy-btn">Buy Now</button>
    </div>
  </main>

</body>
</html>
