<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Grid</title>
    <link rel="stylesheet" href="product.css" />
  </head>
  <body>
    <h1 class="page-title">Product Grid</h1>

    <div class="product-grid">
      <div class="product-card">
        <img src="../images/car1.png" alt="Product 1" />
        <h3>Sport Sedan</h3>
        <p>$45,000</p>
      </div>

      <div class="product-card">
        <img src="../images/car2.png" alt="Product 2" />
        <h3>Luxury SUV</h3>
        <p>$58,000</p>
      </div>

      <div class="product-card">
        <img src="../images/car3.png" alt="Product 3" />
        <h3>City Hatchback</h3>
        <p>$32,000</p>
      </div>

      <div class="product-card">
        <img src="../images/car4.png" alt="Product 4" />
        <h3>Electric Coupe</h3>
        <p>$49,500</p>
      </div>

      <div class="product-card">
        <img src="../images/car5.png" alt="Product 5" />
        <h3>Offroad Truck</h3>
        <p>$61,000</p>
      </div>

      <div class="product-card">
        <img src="../images/car6.png" alt="Product 6" />
        <h3>Family Van</h3>
        <p>$39,900</p>
      </div>

      <div class="product-card">
        <img src="../images/car7.png" alt="Product 7" />
        <h3>Performance Roadster</h3>
        <p>$72,000</p>
      </div>

      <div class="product-card">
        <img src="../images/car8.png" alt="Product 8" />
        <h3>Compact Hybrid</h3>
        <p>$28,500</p>
      </div>
    </div>
  </body>
</html>
